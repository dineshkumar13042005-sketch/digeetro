      @keyframes shockwavePulse {
        0% { transform: scale(0.1); opacity: 0.9; }
        50% { opacity: 0.6; }
        100% { transform: scale(3.5); opacity: 0; }

      .shockwave-anim {
        animation: shockwavePulse 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;

    <!-- PURE REACT APPLICATION - RUNS DIRECTLY WITHOUT VITE -->
    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo, useCallback } = React;

      // Brand color palette
      const BRAND_COLORS = [
        '#5C24E5', // Deep Purple
        '#8B3EE8', // Electric Purple
        '#E02888', // Magenta Pink
        '#FF2E93', // Neon Pink
        '#FF6A3D', // Sunset Orange
        '#FF8C42', // Warm Orange
        '#00B4D8', // Cyan (from logo pixels)
      ];

      // --- PROCEDURAL WEB AUDIO SYNTHESIS ---
      let audioCtx = null;
      let isMuted = true;

      function getAudioContext() {
        if (!audioCtx && typeof window !== 'undefined') {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      const soundManager = {
        playWhoosh(pitch = 1) {
          if (isMuted) return;
          const ctx = getAudioContext();
          if (!ctx) return;
          try {
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const filter = ctx.createBiquadFilter();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(120 * pitch, now);
            osc.frequency.exponentialRampToValueAtTime(380 * pitch, now + 0.25);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.6);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(600, now);
            filter.frequency.exponentialRampToValueAtTime(1400, now + 0.3);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.12, now + 0.2);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now);
            osc.stop(now + 0.65);
          } catch (e) {}
        },

        playHandshakeImpact() {
          if (isMuted) return;
          const ctx = getAudioContext();
          if (!ctx) return;
          try {
            const now = ctx.currentTime;
            // Sub bass impact
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(45, now + 0.35);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.5);

            // High sparkle chime
            const chime = ctx.createOscillator();
            const chimeGain = ctx.createGain();
            chime.type = 'sine';
            chime.frequency.setValueAtTime(1200, now);
            chime.frequency.exponentialRampToValueAtTime(2400, now + 0.15);
            chimeGain.gain.setValueAtTime(0.08, now);
            chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

            chime.connect(chimeGain);
            chimeGain.connect(ctx.destination);
            chime.start(now);
            chime.stop(now + 0.35);
          } catch (e) {}
        },

        playWelcomeChord() {
          if (isMuted) return;
          const ctx = getAudioContext();
          if (!ctx) return;
          try {
            const now = ctx.currentTime;
            const freqs = [392.00, 493.88, 587.33, 783.99]; // G major 7th chord
            freqs.forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.value = freq;
              gain.gain.setValueAtTime(0.001, now);
              gain.gain.linearRampToValueAtTime(0.04, now + 0.1 + idx * 0.05);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + idx * 0.05);
              osc.stop(now + 1.5);
            });
          } catch (e) {}
        }
      };

      // --- INLINE SVG ICONS (Zero external dependencies) ---
      const IconArrowDown = ({ className = "w-4 h-4" }) => (

        </svg>
      );

      const IconArrowUpRight = ({ className = "w-4 h-4" }) => (

      const IconPlay = ({ className = "w-4 h-4" }) => (

      const IconCpu = ({ className = "w-6 h-6" }) => (

          <rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/>

      const IconLayers = ({ className = "w-6 h-6" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

      // --- COMPONENT: ParticleCanvas (60 FPS Background Particles & Shockwaves) ---
      function ParticleCanvas({ progress = 0, onImpactTrigger }) {
        const canvasRef = useRef(null);
        const stateRef = useRef({
          particles: [],
          burstParticles: [],
          shockwaves: [],
          impactFlash: 0,
          hasTriggeredHandshake: false,
          lastProgress: 0,
        });

        useEffect(() => {
          stateRef.current.lastProgress = progress;
        }, [progress]);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          let animationFrameId;
          let width = (canvas.width = window.innerWidth);
          let height = (canvas.height = window.innerHeight);

          const handleResize = () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
          };
          window.addEventListener('resize', handleResize);

          // 65 ambient floating brand particles
          const ambientCount = 65;
          const particles = [];
          for (let i = 0; i < ambientCount; i++) {
            particles.push({
              x: Math.random() * width,
              y: Math.random() * height,
              vx: (Math.random() - 0.5) * 0.6,
              vy: (Math.random() - 0.5) * 0.6 - 0.15,
              radius: Math.random() * 2.8 + 1.2,
              color: BRAND_COLORS[Math.floor(Math.random() * BRAND_COLORS.length)],
              alpha: Math.random() * 0.5 + 0.2,
              pulseSpeed: Math.random() * 0.03 + 0.015,
              pulse: Math.random() * Math.PI,
              isCube: Math.random() > 0.65,
              size: Math.random() * 5 + 3,
              rotation: Math.random() * Math.PI,
              rotationSpeed: (Math.random() - 0.5) * 0.02,
            });
          }
          stateRef.current.particles = particles;

          const triggerHandshakeExplosion = (originX, originY) => {
            stateRef.current.shockwaves = [
              { r: 8, maxR: Math.min(width, height) * 0.48, width: 4.5, color: '#E02888', alpha: 0.9, speed: 14 },
              { r: 4, maxR: Math.min(width, height) * 0.38, width: 3.5, color: '#5C24E5', alpha: 0.85, speed: 10 },
              { r: 2, maxR: Math.min(width, height) * 0.26, width: 2.5, color: '#FF6A3D', alpha: 0.8, speed: 7 },
            ];
            stateRef.current.impactFlash = 1.0;

            const burst = [];
            const burstCount = 160;
            for (let i = 0; i < burstCount; i++) {
              const angle = (Math.PI * 2 * i) / burstCount + (Math.random() - 0.5) * 0.3;
              const speed = Math.random() * 14 + 3;
              const color = BRAND_COLORS[Math.floor(Math.random() * BRAND_COLORS.length)];
              burst.push({
                x: originX,
                y: originY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: Math.random() * 3.5 + 1.5,
                color,
                alpha: 1.0,
                decay: Math.random() * 0.012 + 0.008,
                drag: 0.94,
                isCube: Math.random() > 0.6,
                size: Math.random() * 6 + 3,
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.15,
              });
            }
            stateRef.current.burstParticles = burst;
            if (onImpactTrigger) onImpactTrigger();
          };

          const render = () => {
            ctx.clearRect(0, 0, width, height);
            const p = stateRef.current.lastProgress;
            const handshakeScreenX = width * 0.5;
            const handshakeScreenY = height * 0.53;

            // Trigger handshake impact at 66% - 78%
            if (p >= 0.66 && p <= 0.78 && !stateRef.current.hasTriggeredHandshake) {
              stateRef.current.hasTriggeredHandshake = true;
              triggerHandshakeExplosion(handshakeScreenX, handshakeScreenY);
            } else if (p < 0.63) {
              stateRef.current.hasTriggeredHandshake = false;
            }

            // Impact Flash Bloom
            if (stateRef.current.impactFlash > 0.01) {
              const flash = stateRef.current.impactFlash;
              const glowGrad = ctx.createRadialGradient(
                handshakeScreenX, handshakeScreenY, 0,
                handshakeScreenX, handshakeScreenY, 180 * flash
              );
              glowGrad.addColorStop(0, `rgba(255, 255, 255, ${0.95 * flash})`);
              glowGrad.addColorStop(0.3, `rgba(224, 40, 136, ${0.6 * flash})`);
              glowGrad.addColorStop(0.7, `rgba(92, 36, 229, ${0.3 * flash})`);
              glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
              ctx.fillStyle = glowGrad;
              ctx.beginPath();
              ctx.arc(handshakeScreenX, handshakeScreenY, 180 * flash, 0, Math.PI * 2);
              ctx.fill();
              stateRef.current.impactFlash *= 0.88;
            }

            // Expanding Shockwaves
            for (let i = stateRef.current.shockwaves.length - 1; i >= 0; i--) {
              const sw = stateRef.current.shockwaves[i];
              sw.r += sw.speed;
              sw.alpha *= 0.94;
              if (sw.alpha > 0.02 && sw.r < sw.maxR) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(handshakeScreenX, handshakeScreenY, sw.r, 0, Math.PI * 2);
                ctx.strokeStyle = sw.color;
                ctx.globalAlpha = sw.alpha;
                ctx.lineWidth = sw.width;
                ctx.stroke();
                ctx.restore();
              } else {
                stateRef.current.shockwaves.splice(i, 1);
              }
            }

            // Explosive Burst Particles
            for (let i = stateRef.current.burstParticles.length - 1; i >= 0; i--) {
              const b = stateRef.current.burstParticles[i];
              b.x += b.vx;
              b.y += b.vy;
              b.vx *= b.drag;
              b.vy *= b.drag;
              b.alpha -= b.decay;
              b.rotation += b.rotSpeed;

              if (b.alpha > 0.01) {
                ctx.save();
                ctx.globalAlpha = b.alpha;
                ctx.fillStyle = b.color;
                if (b.isCube) {
                  ctx.translate(b.x, b.y);
                  ctx.rotate(b.rotation);
                  ctx.fillRect(-b.size / 2, -b.size / 2, b.size, b.size);
                } else {
                  ctx.beginPath();
                  ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                  ctx.fill();
                }
                ctx.restore();
              } else {
                stateRef.current.burstParticles.splice(i, 1);
              }
            }

            // Ambient Floating Particles
            const particles = stateRef.current.particles;
            for (let i = 0; i < particles.length; i++) {
              const pt = particles[i];
              pt.x += pt.vx;
              pt.y += pt.vy;
              pt.pulse += pt.pulseSpeed;
              pt.rotation += pt.rotationSpeed;

              if (pt.x < -10) pt.x = width + 10;
              if (pt.x > width + 10) pt.x = -10;
              if (pt.y < -10) pt.y = height + 10;
              if (pt.y > height + 10) pt.y = -10;

              const dynamicAlpha = pt.alpha * (0.65 + Math.sin(pt.pulse) * 0.35);
              ctx.save();
              ctx.globalAlpha = dynamicAlpha;
              ctx.fillStyle = pt.color;
              if (pt.isCube) {
                ctx.translate(pt.x, pt.y);
                ctx.rotate(pt.rotation);
                ctx.fillRect(-pt.size / 2, -pt.size / 2, pt.size, pt.size);
              } else {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
                ctx.fill();
              }
              ctx.restore();
            }

            animationFrameId = requestAnimationFrame(render);
          };

          animationFrameId = requestAnimationFrame(render);
          return () => {
            window.removeEventListener('resize', handleResize);
            cancelAnimationFrame(animationFrameId);
          };
        }, [onImpactTrigger]);

        return (
          <canvas
            ref={canvasRef}
            className="absolute inset-0 pointer-events-none z-10 w-full h-full"
          />
        );
      }

      // --- COMPONENT: LogoScene (0% - 20% Reveal on Pure White) ---
      function LogoScene({ progress = 0 }) {
        const [isLoaded, setIsLoaded] = useState(false);

        useEffect(() => {
          const timer = setTimeout(() => setIsLoaded(true), 200);
          return () => clearTimeout(timer);
        }, []);

        const { scrollOpacity, scale, lightSweepOffset, scrollPromptOpacity } = useMemo(() => {
          let op = 1, sc = 0.94, sweep = -120, promptOp = 1;
          if (progress <= 0.20) {
            const t = progress / 0.20;
            op = 1;
            sc = 0.94 + t * 0.06;
            sweep = -120 + t * 240;
            promptOp = Math.max(0, 1 - progress * 7);
          } else if (progress <= 0.28) {
            const t = (progress - 0.20) / 0.08;
            op = Math.max(0, 1 - t);
            sc = 1.0 + t * 0.05;
            sweep = 120;
            promptOp = 0;
          } else {
            op = 0; sc = 1.05; sweep = 120; promptOp = 0;
          }
          return { scrollOpacity: op, scale: sc, lightSweepOffset: sweep, scrollPromptOpacity: promptOp };
        }, [progress]);

        const combinedOpacity = isLoaded ? scrollOpacity : 0;
        if (progress > 0.30 || combinedOpacity <= 0.001) return null;

        return (
          <div
            className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-20 select-none bg-transparent transition-opacity duration-700 ease-out"
            style={{ opacity: combinedOpacity }}
          >
            <div
              className="relative flex flex-col items-center justify-center max-w-lg w-full px-6 transition-transform duration-100 ease-out will-change-transform"
              style={{ transform: `scale(${isLoaded ? scale : 0.88})` }}
            >
              <div className="absolute inset-0 -m-16 bg-gradient-to-tr from-purple-500/10 via-pink-500/10 to-orange-500/10 rounded-full blur-3xl -z-10 pointer-events-none" />

              <div className="relative overflow-hidden rounded-2xl bg-white p-3 sm:p-4 shadow-sm shadow-purple-500/5">
                <img
                  src="assets/digeetro-logo.jpg"
                  alt="DIGEETRO DIGITAL SOLUTIONS"
                  className="w-68 sm:w-84 md:w-96 max-w-[85vw] h-auto object-contain"
                />
                <div
                  className="absolute inset-0 pointer-events-none"
                  style={{
                    background: 'linear-gradient(105deg, transparent 20%, rgba(255,255,255,0.7) 48%, rgba(255,255,255,0.95) 50%, rgba(255,255,255,0.7) 52%, transparent 80%)',
                    transform: `translateX(${lightSweepOffset}%) skewX(-20deg)`,
                    mixBlendMode: 'overlay',
                  }}
                />
              </div>

              <div
                className="mt-6 flex items-center gap-2 text-xs font-semibold tracking-widest text-neutral-400 uppercase transition-all duration-300"
                style={{ opacity: Math.max(0, 1 - progress * 5) }}
              >
                <IconSparkles className="w-3.5 h-3.5 text-purple-500" />
                <span>Transforming Ideas into Digital Reality</span>
                <IconSparkles className="w-3.5 h-3.5 text-pink-500" />
              </div>
            </div>

            <div
              className="absolute bottom-10 flex flex-col items-center gap-2 text-neutral-400 pointer-events-none transition-opacity duration-300"
              style={{ opacity: scrollPromptOpacity }}
            >
              <div className="w-5 h-8 rounded-full border-2 border-neutral-300 flex items-start justify-center p-1">
                <div className="w-1 h-2 rounded-full bg-neutral-600 animate-bounce" />
              </div>
              <span className="text-[11px] font-semibold tracking-[0.25em] text-neutral-500 uppercase">
                Scroll Down to Begin
              </span>
            </div>
          </div>
        );
      }

      // --- COMPONENT: PencilStickman (Articulated Sketch Character) ---
      function PencilStickman({ side = 'left', progress = 0, shakeIntensity = 0 }) {
        const isLeft = side === 'left';
        const facingDir = isLeft ? 1 : -1;

        const opacity = useMemo(() => {
          if (progress < 0.20) return 0;
          if (progress < 0.26) return (progress - 0.20) / 0.06;
          if (progress <= 0.80) return 1;
          if (progress <= 0.84) return Math.max(0, 1 - (progress - 0.80) / 0.04);
          return 0;
        }, [progress]);

        const kinematics = useMemo(() => {
          const groundY = 490;
          const centerMeetingX = isLeft ? 430 : 570;
          const startX = isLeft ? -160 : 1160;

          const walkStartP = 0.20;
          const walkEndP = 0.54;
          const settleEndP = 0.60;
          const reachEndP = 0.66;
          const shakeEndP = 0.78;

          let posX = startX;
          let isWalking = false;
          let walkPhase = 0;

          if (progress < walkStartP) {
            posX = startX;
          } else if (progress <= walkEndP) {
            isWalking = true;
            const t = (progress - walkStartP) / (walkEndP - walkStartP);
            const easeT = Math.sin(t * (Math.PI / 2));
            posX = startX + (centerMeetingX - startX) * easeT;
            walkPhase = t * Math.PI * 8;
          } else {
            posX = centerMeetingX;
          }

          let bounceY = 0;
          let bodyLean = 0;
          let headNod = 0;

          if (isWalking) {
            bounceY = -Math.abs(Math.sin(walkPhase)) * 8;
            bodyLean = 5 * facingDir;
            headNod = Math.sin(walkPhase * 2) * 2;
          } else if (progress < settleEndP) {
            const t = (progress - walkEndP) / (settleEndP - walkEndP);
            bodyLean = 5 * facingDir * (1 - t);
            headNod = Math.sin(t * Math.PI) * 4;
          } else if (progress < reachEndP) {
            const t = (progress - settleEndP) / (reachEndP - settleEndP);
            bodyLean = 4 * facingDir * t;
            headNod = 2;
          } else if (progress <= shakeEndP) {
            const t = (progress - reachEndP) / (shakeEndP - reachEndP);
            const shakeWave = Math.sin(t * Math.PI * 6);
            bounceY = shakeWave * 3.5;
            bodyLean = 4 * facingDir + shakeWave * 1.5;
            headNod = shakeWave * 3;
          } else {
            bodyLean = 3 * facingDir;
          }

          const hipX = posX;
          const hipY = groundY - 130 + bounceY;
          const neckX = hipX + bodyLean * 3;
          const neckY = hipY - 110;
          const headX = neckX + bodyLean * 1.5;
          const headY = neckY - 26 + headNod;

          let legL_Angle = 0, legR_Angle = 0;
          if (isWalking) {
            legL_Angle = Math.sin(walkPhase) * 28;
            legR_Angle = -Math.sin(walkPhase) * 28;
          } else {
            legL_Angle = -10 * facingDir;
            legR_Angle = 10 * facingDir;
          }

          const kneeLX = hipX + Math.sin((legL_Angle * Math.PI) / 180) * 65;
          const kneeLY = hipY + Math.cos((legL_Angle * Math.PI) / 180) * 65;
          const footLX = kneeLX + Math.sin(((legL_Angle + 4) * Math.PI) / 180) * 65;
          const footLY = groundY;

          const kneeRX = hipX + Math.sin((legR_Angle * Math.PI) / 180) * 65;
          const kneeRY = hipY + Math.cos((legR_Angle * Math.PI) / 180) * 65;
          const footRX = kneeRX + Math.sin(((legR_Angle - 4) * Math.PI) / 180) * 65;
          const footRY = groundY;

          const shoulderX = neckX;
          const shoulderY = neckY + 14;

          let leftArmAngle = 0;
          if (isWalking) {
            leftArmAngle = -Math.sin(walkPhase) * 24;
          } else {
            leftArmAngle = -6 * facingDir;
          }
          const elbowLX = shoulderX + Math.sin((leftArmAngle * Math.PI) / 180) * 52;
          const elbowLY = shoulderY + Math.cos((leftArmAngle * Math.PI) / 180) * 52;
          const handLX = elbowLX + Math.sin(((leftArmAngle + 8) * Math.PI) / 180) * 48;
          const handLY = elbowLY + Math.cos(((leftArmAngle + 8) * Math.PI) / 180) * 48;

          let elbowRX, elbowRY, handRX, handRY;
          const targetHandX = 500;
          const targetHandY = 315;

          if (isWalking) {
            const rightArmAngle = Math.sin(walkPhase) * 24;
            elbowRX = shoulderX + Math.sin((rightArmAngle * Math.PI) / 180) * 52;
            elbowRY = shoulderY + Math.cos((rightArmAngle * Math.PI) / 180) * 52;
            handRX = elbowRX + Math.sin(((rightArmAngle + 8) * Math.PI) / 180) * 48;
            handRY = elbowRY + Math.cos(((rightArmAngle + 8) * Math.PI) / 180) * 48;
          } else if (progress < reachEndP) {
            const t = Math.max(0, (progress - settleEndP) / (reachEndP - settleEndP));
            const idleArmAngle = 8 * facingDir;
            const idleElbowX = shoulderX + Math.sin((idleArmAngle * Math.PI) / 180) * 52;
            const idleElbowY = shoulderY + Math.cos((idleArmAngle * Math.PI) / 180) * 52;
            const idleHandX = idleElbowX + Math.sin(((idleArmAngle + 8) * Math.PI) / 180) * 48;
            const idleHandY = idleElbowY + Math.cos(((idleArmAngle + 8) * Math.PI) / 180) * 48;

            const extendedElbowX = shoulderX + 38 * facingDir;
            const extendedElbowY = shoulderY + 16;
            elbowRX = idleElbowX + (extendedElbowX - idleElbowX) * t;
            elbowRY = idleElbowY + (extendedElbowY - idleElbowY) * t;
            handRX = idleHandX + (targetHandX - idleHandX) * t;
            handRY = idleHandY + (targetHandY - idleHandY) * t;
          } else if (progress <= shakeEndP) {
            const t = (progress - reachEndP) / (shakeEndP - reachEndP);
            const shakePhase = t * Math.PI * 6;
            const pumpY = Math.sin(shakePhase) * 16;
            elbowRX = shoulderX + 42 * facingDir;
            elbowRY = shoulderY + 18 + pumpY * 0.5;
            handRX = targetHandX;
            handRY = targetHandY + pumpY;
          } else {
            elbowRX = shoulderX + 40 * facingDir;
            elbowRY = shoulderY + 18;
            handRX = targetHandX;
            handRY = targetHandY;
          }

          return {
            posX, headX, headY, neckX, neckY, hipX, hipY,
            kneeLX, kneeLY, footLX, footLY, kneeRX, kneeRY, footRX, footRY,
            shoulderX, shoulderY, elbowLX, elbowLY, handLX, handLY,
            elbowRX, elbowRY, handRX, handRY,
          };
        }, [isLeft, facingDir, progress]);

        if (opacity <= 0.001) return null;

        const sketchColor = "#18181b";
        const strokeW = 4.2;

        return (
          <g opacity={opacity} className="transition-opacity duration-150">
            {/* Ground shadow */}
            <ellipse
              cx={kinematics.posX}
              cy={492}
              rx={32}
              ry={6}
              fill="#18181b"
              opacity={0.14}
            />

            {/* Back Arm (Left) */}
            <line x1={kinematics.shoulderX} y1={kinematics.shoulderY} x2={kinematics.elbowLX} y2={kinematics.elbowLY} stroke={sketchColor} strokeWidth={strokeW - 0.5} strokeLinecap="round" opacity={0.8} />
            <line x1={kinematics.elbowLX} y1={kinematics.elbowLY} x2={kinematics.handLX} y2={kinematics.handLY} stroke={sketchColor} strokeWidth={strokeW - 0.5} strokeLinecap="round" opacity={0.8} />

            {/* Left Leg */}
            <line x1={kinematics.hipX} y1={kinematics.hipY} x2={kinematics.kneeLX} y2={kinematics.kneeLY} stroke={sketchColor} strokeWidth={strokeW} strokeLinecap="round" />
            <line x1={kinematics.kneeLX} y1={kinematics.kneeLY} x2={kinematics.footLX} y2={kinematics.footLY} stroke={sketchColor} strokeWidth={strokeW} strokeLinecap="round" />
            <line x1={kinematics.footLX} y1={kinematics.footLY} x2={kinematics.footLX + 12 * facingDir} y2={kinematics.footLY} stroke={sketchColor} strokeWidth={strokeW} strokeLinecap="round" />

            {/* Right Leg */}
            <line x1={kinematics.hipX} y1={kinematics.hipY} x2={kinematics.kneeRX} y2={kinematics.kneeRY} stroke={sketchColor} strokeWidth={strokeW} strokeLinecap="round" />
            <line x1={kinematics.kneeRX} y1={kinematics.kneeRY} x2={kinematics.footRX} y2={kinematics.footRY} stroke={sketchColor} strokeWidth={strokeW} strokeLinecap="round" />
            <line x1={kinematics.footRX} y1={kinematics.footRY} x2={kinematics.footRX + 12 * facingDir} y2={kinematics.footRY} stroke={sketchColor} strokeWidth={strokeW} strokeLinecap="round" />

            {/* Spine */}
            <line x1={kinematics.neckX} y1={kinematics.neckY} x2={kinematics.hipX} y2={kinematics.hipY} stroke={sketchColor} strokeWidth={strokeW + 0.6} strokeLinecap="round" />

            {/* Head */}
            <circle cx={kinematics.headX} cy={kinematics.headY} r={22} fill="#ffffff" stroke={sketchColor} strokeWidth={strokeW} />
            {/* Eye facing center */}
            <circle cx={kinematics.headX + 9 * facingDir} cy={kinematics.headY - 2} r={2.5} fill={sketchColor} />
            {/* Friendly smile */}
            <path
              d={`M ${kinematics.headX + 4 * facingDir} ${kinematics.headY + 7} Q ${kinematics.headX + 9 * facingDir} ${kinematics.headY + 11} ${kinematics.headX + 14 * facingDir} ${kinematics.headY + 6}`}
              fill="none"
              stroke={sketchColor}
              strokeWidth={2.4}
              strokeLinecap="round"
            />

            {/* Front Arm (Right - Handshake arm) */}
            <line x1={kinematics.shoulderX} y1={kinematics.shoulderY} x2={kinematics.elbowRX} y2={kinematics.elbowRY} stroke={sketchColor} strokeWidth={strokeW} strokeLinecap="round" />
            <line x1={kinematics.elbowRX} y1={kinematics.elbowRY} x2={kinematics.handRX} y2={kinematics.handRY} stroke={sketchColor} strokeWidth={strokeW} strokeLinecap="round" />
            <circle cx={kinematics.handRX} cy={kinematics.handRY} r={3.5} fill={sketchColor} />
          </g>
        );
      }

      // --- COMPONENT: HandshakeScene (60% - 80% Handshake Clasp & Energy Rays) ---
      function HandshakeScene({ progress = 0, cameraShake = { x: 0, y: 0 } }) {
        const reachEndP = 0.66;
        const shakeEndP = 0.78;
        const isHandshakeActive = progress >= reachEndP && progress <= 0.80;

        const stageOpacity = useMemo(() => {
          if (progress < 0.20) return 0;
          if (progress < 0.26) return (progress - 0.20) / 0.06;
          if (progress <= 0.80) return 1;
          if (progress <= 0.84) return Math.max(0, 1 - (progress - 0.80) / 0.04);
          return 0;
        }, [progress]);

        const shakeIntensity = useMemo(() => {
          if (progress < reachEndP || progress > 0.80) return 0;
          if (progress <= shakeEndP) {
            const t = (progress - reachEndP) / (shakeEndP - reachEndP);
            return Math.sin(t * Math.PI);
          }
          return Math.max(0, 1 - (progress - shakeEndP) / 0.02);
        }, [progress, reachEndP, shakeEndP]);

        const pumpOffset = useMemo(() => {
          if (progress >= reachEndP && progress <= shakeEndP) {
            const shakePhase = ((progress - reachEndP) / (shakeEndP - reachEndP)) * Math.PI * 6;
            return Math.sin(shakePhase) * 16;
          }
          return 0;
        }, [progress, reachEndP, shakeEndP]);

        const energyRays = useMemo(() => {
          if (!isHandshakeActive) return [];
          const count = 14;
          const rays = [];
          const centerX = 500;
          const centerY = 315 + pumpOffset;
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2 + (progress * 6);
            const innerR = 30 + Math.sin(i * 3 + progress * 20) * 8;
            const length = 24 + Math.cos(i * 2) * 12 + shakeIntensity * 18;
            rays.push({
              x1: centerX + Math.cos(angle) * innerR,
              y1: centerY + Math.sin(angle) * innerR,
              x2: centerX + Math.cos(angle) * (innerR + length),
              y2: centerY + Math.sin(angle) * (innerR + length),
              opacity: 0.35 + Math.sin(i + progress * 30) * 0.4,
            });
          }
          return rays;
        }, [isHandshakeActive, progress, pumpOffset, shakeIntensity]);

        if (progress < 0.18 || progress > 0.86 || stageOpacity <= 0.001) return null;

        return (
          <div
            className="absolute inset-0 flex items-center justify-center pointer-events-none transition-transform duration-75 select-none"
            style={{
              transform: `translate3d(${cameraShake.x}px, ${cameraShake.y}px, 0)`,
              opacity: stageOpacity,
            }}
          >
            <svg
              viewBox="0 0 1000 600"
              className="w-full h-full max-w-6xl max-h-[85vh] overflow-visible"
              preserveAspectRatio="xMidYMid meet"
            >
              <defs>
                <filter id="pencil-texture" x="-10%" y="-10%" width="120%" height="120%">
                  <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
                  <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.0" xChannelSelector="R" yChannelSelector="G" />
                </filter>
              </defs>

              {/* Minimalist sketchy ground line */}
              <g opacity={stageOpacity * 0.85}>
                <path d="M 40 490 Q 250 491 500 489.5 T 960 490" fill="none" stroke="#1c1917" strokeWidth="2.2" strokeLinecap="round" opacity="0.25" />
                <path d="M 120 492 L 280 492 M 420 491.5 L 580 491.5 M 720 492 L 880 492" fill="none" stroke="#1c1917" strokeWidth="1.2" strokeLinecap="round" opacity="0.12" />
              </g>

              {/* The Two Pencil Stickmen */}
              <g filter="url(#pencil-texture)">
                <PencilStickman side="left" progress={progress} shakeIntensity={shakeIntensity} />
                <PencilStickman side="right" progress={progress} shakeIntensity={shakeIntensity} />
              </g>

              {/* Clasped Hands Joint */}
              {progress >= reachEndP && progress <= 0.84 && (
                <g
                  transform={`translate(500, ${315 + pumpOffset})`}
                  opacity={progress <= 0.80 ? 1 : Math.max(0, 1 - (progress - 0.80) / 0.04)}
                >
                  <ellipse cx="0" cy="0" rx="9" ry="7" fill="#18181b" />
                  <path d="M -6 -5 Q 0 -8 6 -4 M -7 0 Q 0 -3 7 1 M -6 4 Q 0 1 6 5" fill="none" stroke="#ffffff" strokeWidth="1.4" strokeLinecap="round" opacity="0.85" />
                  <path d="M -8 -3 Q -4 6 5 4" fill="none" stroke="#18181b" strokeWidth="2.4" strokeLinecap="round" />
                </g>
              )}

              {/* Sketchy pencil energy rays around handshake */}
              {isHandshakeActive && (
                <g>
                  {energyRays.map((r, i) => (
                    <line key={`ray-${i}`} x1={r.x1} y1={r.y1} x2={r.x2} y2={r.y2} stroke="#18181b" strokeWidth={1.8 + (i % 2) * 0.8} strokeLinecap="round" opacity={r.opacity * shakeIntensity} />
                  ))}
                  <path d={`M 470 ${315 + pumpOffset - 25} A 35 35 0 0 1 530 ${315 + pumpOffset - 25}`} fill="none" stroke="#18181b" strokeWidth="1.6" strokeDasharray="4 4" opacity={0.4 * shakeIntensity} />
                  <path d={`M 465 ${315 + pumpOffset + 28} A 40 40 0 0 0 535 ${315 + pumpOffset + 28}`} fill="none" stroke="#18181b" strokeWidth="1.6" strokeDasharray="5 3" opacity={0.35 * shakeIntensity} />
                </g>
              )}
            </svg>
          </div>
        );
      }

      // --- COMPONENT: WelcomeScene (80% - 100% Final Reveal) ---

            <div className="relative max-w-4xl mx-auto flex flex-col items-center">

                        {char}

                    transform: `translateX(${lightSweep}%) skewX(-25deg)`,
                    mixBlendMode: 'overlay',
                  }}

              </div>

              {/* LINE 3: DIGITAL SOLUTIONS - Clean professional typography */}

      // --- COMPONENT: DigeetroHero (Mindly-Style Hero Landing Section) ---
      function DigeetroHero({ onWatchOpeningStory }) {

        const handleMouseMove = (e) => {
          const rect = e.currentTarget.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width - 0.5;
          const y = (e.clientY - rect.top) / rect.height - 0.5;
          setMousePos({ x, y });
        };

        const handleMouseLeave = () => setMousePos({ x: 0, y: 0 });

        return (
          <div className="min-h-screen bg-[#f4f4f7] py-8 sm:py-12 px-3 sm:px-6 md:px-10 flex items-center justify-center font-['Plus_Jakarta_Sans'] select-none">

              onMouseMove={handleMouseMove}
              onMouseLeave={handleMouseLeave}
              className="relative w-full max-w-7xl bg-[#fafafa] rounded-[2rem] sm:rounded-[2.75rem] border border-neutral-200/80 shadow-[0_25px_70px_-15px_rgba(92,36,229,0.12),0_10px_30px_-5px_rgba(0,0,0,0.06)] overflow-hidden transition-all duration-300"
            >
              <div className="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-purple-400 via-pink-400 to-orange-400 opacity-60" />

              {/* Navigation Bar */}
              <header className="relative z-30 pt-6 sm:pt-8 px-6 sm:px-12 flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <img src="assets/digeetro-logo.jpg" alt="DIGEETRO" className="h-9 sm:h-10 w-auto object-contain rounded" />
                </div>

                <nav className="hidden md:flex items-center gap-1.5 p-1.5 rounded-full bg-white/70 backdrop-blur-md border border-neutral-200/70 shadow-xs text-xs font-medium text-neutral-600">
                  <button className="px-4 py-1.5 rounded-full hover:text-neutral-900 transition-colors cursor-pointer">Features</button>
                  <button className="px-4 py-1.5 rounded-full hover:text-neutral-900 transition-colors cursor-pointer">How it works</button>
                  <button className="px-4 py-1.5 rounded-full bg-white text-neutral-900 font-semibold shadow-xs border border-neutral-100 transition-colors cursor-pointer">Integrations</button>
                  <button className="px-4 py-1.5 rounded-full hover:text-neutral-900 transition-colors cursor-pointer">Pricing</button>
                </nav>

                <button className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-neutral-950 text-white text-xs font-semibold hover:bg-neutral-800 transition-all hover:scale-105 active:scale-95 shadow-sm cursor-pointer">

                  <IconArrowUpRight className="w-3.5 h-3.5" />

      // --- MAIN APP COMPONENT ---
      function App() {
        const containerRef = useRef(null);
        const trackRef = useRef(null);
        const lenisRef = useRef(null);

        const [progress, setProgress] = useState(0);
        const [cameraShake, setCameraShake] = useState({ x: 0, y: 0 });

        const soundFlagsRef = useRef({
          logo: false,
          handshake: false,
          welcome: false,
        });

        const triggerCameraShake = useCallback(() => {
          let startTime = performance.now();
          const duration = 650;
          const initialAmp = 8;
          soundManager.playHandshakeImpact();

          const shakeLoop = (currentTime) => {
            const elapsed = currentTime - startTime;
            if (elapsed < duration) {
              const decay = Math.exp(-elapsed / 160);
              const amp = initialAmp * decay;
              const x = (Math.random() - 0.5) * 2 * amp;
              const y = (Math.random() - 0.5) * 2 * amp;
              setCameraShake({ x, y });
              requestAnimationFrame(shakeLoop);
            } else {
              setCameraShake({ x: 0, y: 0 });
            }
          };
          requestAnimationFrame(shakeLoop);
        }, []);

        useEffect(() => {
          if (window.gsap && window.ScrollTrigger) {
            window.gsap.registerPlugin(window.ScrollTrigger);
          }

          if (window.Lenis) {
            const lenis = new window.Lenis({
              duration: 1.2,
              easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
              orientation: 'vertical',
              smoothWheel: true,
            });
            lenisRef.current = lenis;

            if (window.ScrollTrigger) {
              lenis.on('scroll', window.ScrollTrigger.update);
            }
            if (window.gsap) {
              window.gsap.ticker.add((time) => lenis.raf(time * 1000));
              window.gsap.ticker.lagSmoothing(0);
            }
          }

          const track = trackRef.current;
          if (!track || !window.ScrollTrigger) return;

          const st = window.ScrollTrigger.create({
            trigger: track,
            start: 'top top',
            end: 'bottom bottom',
            scrub: 0.4,
            onUpdate: (self) => {
              const p = self.progress;
              setProgress(p);

              if (p > 0.04 && p < 0.18 && !soundFlagsRef.current.logo) {
                soundFlagsRef.current.logo = true;
                soundManager.playWhoosh(1.2);
              } else if (p < 0.03) {
                soundFlagsRef.current.logo = false;
              }

              if (p >= 0.66 && p <= 0.78 && !soundFlagsRef.current.handshake) {
                soundFlagsRef.current.handshake = true;
                triggerCameraShake();
              } else if (p < 0.63) {
                soundFlagsRef.current.handshake = false;
              }

              if (p >= 0.84 && !soundFlagsRef.current.welcome) {
                soundFlagsRef.current.welcome = true;
                soundManager.playWelcomeChord();
              } else if (p < 0.80) {
                soundFlagsRef.current.welcome = false;
              }
            },
          });

          return () => {
            st.kill();
            if (lenisRef.current) lenisRef.current.destroy();
          };
        }, [triggerCameraShake]);

        const handleReplay = () => {
          if (lenisRef.current) {
            lenisRef.current.scrollTo(0);
          } else {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
          setProgress(0);
        };

        const handleExploreServices = () => {
          const heroEl = document.getElementById('hero-landing-page');
          if (heroEl) {
            if (lenisRef.current) {
              lenisRef.current.scrollTo(heroEl);
            } else {
              heroEl.scrollIntoView({ behavior: 'smooth' });
            }
          }
        };

        return (
          <div className="relative bg-white text-neutral-900 select-none">
            {/* Scroll Track: 650vh for the opening animation */}
            <div ref={trackRef} className="relative w-full h-[650vh]">
              <div
                ref={containerRef}
                className="sticky top-0 h-screen w-full overflow-hidden bg-white flex items-center justify-center"
              >
                {/* 1. Canvas VFX: Particles, Shockwaves, Flash */}
                <ParticleCanvas progress={progress} onImpactTrigger={triggerCameraShake} />

                {/* 2. Scene 1: Logo Reveal (0% - 25%) */}
                <LogoScene progress={progress} />

                {/* 3. Scene 2 & 3: Stickmen & Handshake (20% - 85%) */}
                <HandshakeScene progress={progress} cameraShake={cameraShake} />

                {/* 4. Scene 4: Welcome to DIGEETRO (78% - 100%) */}
                <WelcomeScene
                  progress={progress}
                  onReplay={handleReplay}
                  onExploreServices={handleExploreServices}
                />
              </div>
            </div>

            {/* Mindly-style Ultra-Premium Landing Page Hero Section */}
            <div id="hero-landing-page">
              <DigeetroHero onWatchOpeningStory={handleReplay} />
            </div>

            {/* Agency Services Showcase */}
            <AgencyShowcase />
          </div>
        );
      }

      // Mount Pure React Application
      const root = ReactDOM.createRoot(document.getElementById('root'));

    </script>
